<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ventas - Firebase</title>

<style>
body{
font-family: Arial, Helvetica, sans-serif;
background:#f5f5f5;
padding:20px;
}

h1{
text-align:center;
}

.container{
max-width:900px;
margin:auto;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.1);
}

input, button{
padding:10px;
margin:5px 0;
width:100%;
border-radius:5px;
border:1px solid #ccc;
}

button{
background:#007BFF;
color:white;
cursor:pointer;
}

button:hover{
background:#0056b3;
}

table{
width:100%;
border-collapse: collapse;
margin-top:20px;
}

th, td{
padding:10px;
border-bottom:1px solid #ddd;
text-align:center;
}

.acciones button{
width:auto;
padding:5px 10px;
margin:2px;
}

.eliminar{
background:#dc3545;
}

.editar{
background:#28a745;
}

.total{
text-align:right;
font-size:18px;
margin-top:10px;
}

</style>

</head>
<body>

<div class="container">
<h1>CRUD de Ventas - Firebase</h1>

<input type="hidden" id="id">

<label>Cliente</label>
<input type="text" id="cliente">

<label>Producto</label>
<input type="text" id="producto">

<label>Precio</label>
<input type="number" id="precio">

<label>Cantidad</label>
<input type="number" id="cantidad">

<button onclick="guardarVenta()">Guardar Venta</button>

<table>
<thead>
<tr>
<th>ID</th>
<th>Cliente</th>
<th>Producto</th>
<th>Precio</th>
<th>Cantidad</th>
<th>Total</th>
<th>Acciones</th>
</tr>
</thead>
<tbody id="tablaVentas"></tbody>
</table>

<div class="total">
<strong>Total Ventas: $ <span id="totalGeneral">0</span></strong>
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import {
getFirestore,
collection,
addDoc,
getDocs,
deleteDoc,
doc,
updateDoc
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD-Nvye_LfZYtKjmQpKze8vFe6413_YI0M",
  authDomain: "ventas-app-pro-e79d1.firebaseapp.com",
  projectId: "ventas-app-pro-e79d1",
  storageBucket: "ventas-app-pro-e79d1.firebasestorage.app",
  messagingSenderId: "626312936837",
  appId: "1:626312936837:web:bb8ecd7923e20dc623d8ec"
};
  
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let editando = null;

window.guardarVenta = async () => {

const cliente = document.getElementById('cliente').value;
const producto = document.getElementById('producto').value;
const precio = document.getElementById('precio').value;
const cantidad = document.getElementById('cantidad').value;

if(cliente === '' || producto === '' || precio === '' || cantidad === ''){
alert('Completa todos los campos');
return;
}

if(editando){

await updateDoc(doc(db,"ventas",editando),{
cliente,
producto,
precio: parseFloat(precio),
cantidad: parseInt(cantidad),
total: precio * cantidad,
fecha: new Date()
});

editando = null;

}else{

await addDoc(collection(db,"ventas"),{
cliente,
producto,
precio: parseFloat(precio),
cantidad: parseInt(cantidad),
total: precio * cantidad,
fecha: new Date()
});

}

limpiar();
mostrarVentas();

}

async function mostrarVentas(){

const tabla = document.getElementById('tablaVentas');
tabla.innerHTML = '';

const querySnapshot = await getDocs(collection(db,"ventas"));

let totalGeneral = 0;

querySnapshot.forEach((docu)=>{

let data = docu.data();

let fila = `
<tr>
<td>${docu.id}</td>
<td>${data.cliente}</td>
<td>${data.producto}</td>
<td>$${data.precio}</td>
<td>${data.cantidad}</td>
<td>$${data.total}</td>
<td>
<button class="editar" onclick="editar('${docu.id}','${data.cliente}','${data.producto}','${data.precio}','${data.cantidad}')">Editar</button>
<button class="eliminar" onclick="eliminar('${docu.id}')">Eliminar</button>
</td>
</tr>
`;



tabla.innerHTML += fila;


totalGeneral += data.total;

});


document.getElementById('totalGeneral').innerText = totalGeneral;

}

window.editar = (id,cliente,producto,precio,cantidad)=>{

editando = id;

document.getElementById('cliente').value = cliente;
document.getElementById('producto').value = producto;
document.getElementById('precio').value = precio;
document.getElementById('cantidad').value = cantidad;

}

window.eliminar = async(id)=>{

await deleteDoc(doc(db,"ventas",id));
mostrarVentas();

}

function limpiar(){

document.getElementById('cliente').value = '';
document.getElementById('producto').value = '';
document.getElementById('precio').value = '';
document.getElementById('cantidad').value = '';

}

mostrarVentas();

</script>

</body>
</html>
